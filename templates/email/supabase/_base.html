<!-- LearnWithPython · Supabase Auth email template
     Paste into: Supabase Dashboard → Authentication → Emails → Templates

     Constraints these emails live under, which is why the markup looks
     twenty years old: Outlook renders through Word, so layout is tables,
     not flexbox or grid. Gmail strips most of <head>, so every style is
     inline. No CSS variables — literal hex only. 600px is the safe width.

     Supabase substitutes {{ .ConfirmationURL }} etc. server-side. Those are
     Go template tags, not Jinja, and must be left exactly as written.
